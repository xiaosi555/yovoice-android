name: Android Native Runtime (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/native/**"
      - ".github/workflows/android-native-runtime.yml"

permissions:
  contents: read

concurrency:
  group: android-native-runtime-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-audio-cpp-android:
    name: Build audio.cpp C ABI for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Yovoice Android port
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Configure pinned audio.cpp source
        run: |
          cmake -G Ninja -S android/native -B build/audio-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_HOME}/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build embedded inference library
        run: cmake --build build/audio-android-arm64 --target yovoice_jni --parallel 2

      - name: Verify Android ELF and C ABI exports
        run: |
          LIB="build/audio-android-arm64/bin/libaudiocpp.so"
          JNI="build/audio-android-arm64/bin/libyovoice_jni.so"
          test -s "$LIB"
          test -s "$JNI"
          file "$LIB" "$JNI"
          "${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$LIB" | grep -E "Class:|Machine:"
          "${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$LIB" | grep "audiocpp_abi_version"
          "${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D "$JNI" | grep "Java_com_xiaosi555_yovoice_NativeEngine_nativeProbe"

      - name: Upload Android ARM64 runtime library
        uses: actions/upload-artifact@v4
        with:
          name: yovoice-audio-cpp-android-arm64
          path: |
            build/audio-android-arm64/bin/libaudiocpp.so
            build/audio-android-arm64/bin/libyovoice_jni.so
            build/audio-android-arm64/_deps/audio_cpp-src/include/audiocpp.h
          if-no-files-found: error
          retention-days: 14
