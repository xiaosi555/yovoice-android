name: Android Debug APK (ARM64 测试包)

on:
  # Build once when this workflow itself is intentionally enabled/updated.
  # Ordinary Android source commits remain validation-only; avoid repeated long APK builds.
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk-test.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug-apk:
    # Interim ARM64 debug build for early installation and device smoke testing.
    # This is not a release APK and does not imply feature parity or device validation.
    name: Build and inspect ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Install Gradle 8.13
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build debug APK with parallel Gradle workers
        run: gradle --no-daemon --parallel --max-workers=2 -p android :app:assembleDebug

      - name: Verify APK and packaged ARM64 native libraries
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -q "lib/arm64-v8a/libyovoice_jni.so" /tmp/apk-contents.txt
          grep -q "lib/arm64-v8a/libaudiocpp.so" /tmp/apk-contents.txt
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yovoice-android-arm64-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
