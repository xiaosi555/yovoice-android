name: Android Validation (APK 发布门禁)

on:
  # 仅手动运行。开发期间推送代码不自动产出 APK；
  # 只有 Android 端功能、模型下载/校验/加载和真机测试通过后，才启用发布构建。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-validation:
    name: Android validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.13
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Verify Android source and unit tests (no APK packaging)
        run: gradle --no-daemon -p android :app:testDebugUnitTest

      # assembleDebug / bundleRelease intentionally disabled until the release gate
      # includes native runtime, model lifecycle, device smoke tests and inference tests.
