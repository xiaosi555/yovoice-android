name: Android Validation (APK 发布门禁)

on:
  # 开发期间推送代码只运行源码与单元测试，不会产出 APK；
  # 只有 Android 端功能、模型下载/校验/加载和真机测试通过后，才启用发布构建。
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-validation:
    name: Android validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" \\
            "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Install Gradle 8.13
        run: |
          curl -fsSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Compile ARM64 JNI runtime and verify Android source/unit tests (no APK packaging)
        run: gradle --no-daemon -p android :app:externalNativeBuildDebug :app:testDebugUnitTest

      # assembleDebug / bundleRelease intentionally disabled until the release gate
      # includes native runtime, model lifecycle, device smoke tests and inference tests.
